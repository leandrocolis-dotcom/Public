name: Varredura do mercado (Sinais de hoje → Todas)

# Todo pregão, depois do fechamento, das cotações (update-prices) e das notas quant (22:40 UTC): Decisão do trader para
# o universo inteiro (~900 ativos), gravada em data/market-scan.json. Ver scripts/market-scan.mjs.
on:
  schedule:
    - cron: "10 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-scan
  cancel-in-progress: false

jobs:
  scan:
    name: Analisar e publicar
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Varrer
        run: node scripts/market-scan.mjs
      - name: Commitar se mudou
        run: |
          if git diff --quiet -- data/market-scan.json && [ -z "$(git ls-files --others --exclude-standard data/market-scan.json)" ]; then
            echo "Nada novo."
            exit 0
          fi
          git config user.name "pendulo-bot"
          git config user.email "pendulo-bot@users.noreply.github.com"
          git add data/market-scan.json
          git commit -m "chore(mercado): varredura diária do universo [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
