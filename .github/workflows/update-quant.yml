name: Quant Aberto (S&P 500)

# Todo pregão, depois do fechamento (22:40 UTC): notas quant das ações do S&P 500 (data/quant.json) e, na primeira
# execução de cada mês, a foto do diário fora da amostra (data/quant-journal.json). Ver docs/QUANT-ABERTO.md.
on:
  schedule:
    - cron: "40 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-quant
  cancel-in-progress: false

jobs:
  quant:
    name: Calcular notas e publicar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Coletar e calcular (mantém os arquivos anteriores se a coleta falhar)
        run: node scripts/update-quant.mjs
      - name: Commitar se mudou
        run: |
          if git diff --quiet -- data/quant.json data/quant-journal.json; then
            echo "Nada novo."
            exit 0
          fi
          git config user.name "pendulo-bot"
          git config user.email "pendulo-bot@users.noreply.github.com"
          git add data/quant.json data/quant-journal.json
          git commit -m "chore(quant): notas do S&P 500 [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
