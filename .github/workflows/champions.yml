name: Campeões dos setores (revisão mensal)

# Revisão mensal da lista 🏆 da aba Decisões (docs/ROADMAP-CAMPEOES.md): varre todas as ações das bolsas dos EUA,
# nota de qualidade + tendência por setor, com folga para entrar e sair. Roda nos 3 primeiros dias do mês (o script
# não refaz se a revisão do mês já existe), depois do fechamento.
on:
  schedule:
    - cron: "30 22 1-3 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: champions
  cancel-in-progress: false

jobs:
  review:
    name: Revisar e publicar
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Revisar campeões
        run: node scripts/champions.mjs
      - name: Commitar se mudou
        run: |
          if git diff --quiet -- data/champions.json; then
            echo "Nada novo."
            exit 0
          fi
          git config user.name "pendulo-bot"
          git config user.email "pendulo-bot@users.noreply.github.com"
          git add data/champions.json
          git commit -m "chore(campeões): revisão mensal [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
