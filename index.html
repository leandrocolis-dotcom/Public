    <script>
      // Aplica o tema salvo antes de pintar a página (evita o "flash" de tema errado).
      try {
        var u = JSON.parse(localStorage.getItem("pendulo.ui") || "{}");
        var themes = {
          midnight: "dark",
          graphite: "dark",
          ember: "dark",
          terminal: "dark",
          paper: "light",
          mist: "light",
        };
        var t =
          u.theme === "auto"
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "midnight"
              : "paper"
            : u.theme;
        if (themes[t]) {
          var h = document.documentElement;
          h.dataset.theme = t;
          h.dataset.mode = themes[t];
        }
        if (u.cb) document.documentElement.dataset.cb = "1";
        if (u.nav === "top" || u.nav === "bottom") document.documentElement.dataset.nav = u.nav;
        if (u.fs) document.documentElement.style.setProperty("--fs", u.fs);
        if (u.zoom && u.zoom != 1) {
          document.documentElement.style.zoom = u.zoom;
          document.documentElement.style.setProperty("--zoom", u.zoom);
        }
      } catch (e) {}
    </script>

  <body>
    <div class="app">
      <aside class="rail" aria-label="Navegação principal">
        <div class="brand" id="brand"></div>
        <nav class="tabs" id="tabs" role="tablist" aria-label="Seções"></nav>
        <div class="rail-foot">
          <button class="btn ghost" data-tab="settings" data-gear title="Configurações">
            <span class="lb">Configurações</span>
          </button>
        </div>
      </aside>

      <div class="stage">
        <header class="top">
          <div class="top-in">
            <button
              class="btn ghost icon-btn rail-tg"
              data-rail-toggle
              title="Recolher menu ( [ )"
              aria-label="Recolher menu"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="4" width="18" height="16" rx="2" />
                <path d="M9 4v16" />
              </svg>
            </button>
            <span class="brand-m" id="brandM" aria-hidden="true"></span>
            <h1 class="page" id="pageTitle">Pêndulo</h1>
            <div id="freshness" class="fresh" role="status" aria-live="polite"></div>
            <button id="auditPill" class="audit-pill" data-tab="checks" hidden></button>
            <div class="top-ctl">
              <div id="mktSwitch" class="mkt-sw" role="group" aria-label="Modo de mercado"></div>
              <div class="zoom-ctl" role="group" aria-label="Zoom da tela">
                <button data-zoom="-1" title="Diminuir zoom (−)" aria-label="Diminuir zoom">
                  −
                </button>
                <button data-zoom="0" id="zoomVal" title="Voltar a 100% (0)" aria-label="Zoom 100%">
                  100%
                </button>
                <button data-zoom="1" title="Aumentar zoom (+)" aria-label="Aumentar zoom">
                  +
                </button>
              </div>
              <button
                class="btn ghost icon-btn"
                data-action="search"
                title="Buscar ativo (/)"
                aria-label="Buscar ativo"
              ></button>
              <button
                class="btn ghost icon-btn"
                data-action="bell"
                title="Sinais e notificações"
                aria-label="Sinais e notificações"
              >
                <span id="bellCount" class="bell-count" hidden></span>
              </button>
              <button
                class="btn ghost icon-btn"
                data-tab="settings"
                data-gear
                title="Configurações"
                aria-label="Configurações"
              ></button>
              <button
                class="btn"
                data-action="reload"
                title="Recarregar dados (R)"
                aria-label="Recarregar"
              >
                <span class="lb">Recarregar</span>
              </button>
            </div>
          </div>
        </header>

        <div id="banner" class="banner" hidden></div>
        <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
        <main id="view" tabindex="-1"></main>
        <footer class="foot">
          Material educacional; não constitui recomendação de investimento. Fluxo inferido por
          preço, não por captação. Fonte dos preços: Yahoo Finance (gratuita, sem garantia).
          Backtests sem custos, impostos, spread ou funding.
        </footer>
      </div>
    </div>

    <nav class="dock" id="dock" aria-label="Navegação"></nav>

    <aside id="drawer" class="drawer" hidden aria-modal="true" role="dialog">
      <div class="drawer-bg" data-action="close"></div>
      <div class="drawer-box">
        <button class="x" data-action="close" aria-label="Fechar">×</button>
        <div id="drawerBody"></div>
      </div>
    </aside>

    <script src="vendor/chart.umd.min.js"></script>
    <script type="module" src="assets/app.js"></script>
  </body>
